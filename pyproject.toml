[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-regress"
version = "0.1.0"
description = "Regression tests for LLM prompts: run a suite, save the results, see exactly what changed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Elif Yıldırım" }]
keywords = ["llm", "prompt", "testing", "evaluation", "regression", "anthropic", "openai", "ollama"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
prompt-regress = "prompt_regress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
